name: Planner browser regression
on:
  pull_request:
    paths:
      - "console/**"
      - ".github/workflows/planner-browser.yml"
      - "tests/browser/**"
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: console
      - run: python -m pip install playwright==1.51.0 pillow
      - run: python tests/browser/survey_redraw.py
