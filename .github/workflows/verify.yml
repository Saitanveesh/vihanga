name: Standalone Vihanga checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: python -m pip install -e './backend[dev]'
      - name: API regression and no-actuation tests
        run: python -m pytest -q backend/tests
      - name: Python compile
        run: python -m compileall -q backend/vihanga


  telemetry-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GCS API, cloud broker, edge agent and test dependencies
        run: python -m pip install -e './backend[dev]' -e './cloud[dev]' -e './edge[dev]'
      - name: Real serialized MAVLink through receive-only edge, cloud WSS and GCS
        run: python -m pytest -q integration/tests
      - name: Compile integration suite
        run: python -m compileall -q integration/tests

  staging-package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate private-cloud Docker Compose configuration
        run: |
          cp cloud/.env.example cloud/.env
          docker compose -f cloud/compose.staging.yml config --quiet
      - name: Build reproducible staging relay container
        run: docker build -f cloud/Dockerfile cloud --tag vihanga-cloud:ci
      - name: Exercise the broker inside the staging image
        shell: bash
        run: |
          set -euo pipefail
          export VIHANGA_CI_TOKEN
          VIHANGA_CI_TOKEN="$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          export VIHANGA_CLOUD_AIRCRAFT_JSON
          VIHANGA_CLOUD_AIRCRAFT_JSON="$(python3 -c 'import hashlib,json,os; h=lambda s: hashlib.sha256(s.encode()).hexdigest(); t=os.environ["VIHANGA_CI_TOKEN"]; print(json.dumps([dict(vehicle_id="CI-001", system_id=1, organization="ci", device_token_sha256=h(t), viewer_token_sha256=h(h(t)))]))')"
          container="$(docker run -d --read-only --cap-drop ALL --security-opt no-new-privileges -e VIHANGA_CLOUD_AIRCRAFT_JSON vihanga-cloud:ci)"
          trap 'docker logs "$container"; docker rm -f "$container" >/dev/null' EXIT
          docker exec -i -e VIHANGA_CI_TOKEN "$container" python - < cloud/checks/container_smoke.py
          docker exec -i -e VIHANGA_CI_TOKEN "$container" python - < cloud/checks/socket_latency.py
      - name: Check container never publishes public host ports in Compose
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq '127.0.0.1:8750:8750' cloud/compose.staging.yml; then
            echo "FAIL: broker host binding is not loopback"
            exit 1
          fi
          echo "PASS: Docker compose loopback binding"

  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent cloud broker
        run: python -m pip install -e './cloud[dev]'
      - name: Cloud device/viewer ACL, CRC, fan-out and fleet tests
        run: python -m pytest -q cloud/tests
      - name: Compile cloud source
        run: python -m compileall -q cloud/vihanga_cloud

  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pi telemetry edge package
        run: python -m pip install -e './edge[dev]'
      - name: Edge serial parser, spoof rejection and configuration tests
        run: python -m pytest -q edge/tests
      - name: Compile edge source
        run: python -m compileall -q edge/vihanga_edge

  console:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install console dependencies
        run: npm ci --no-audit --no-fund
      - name: React operator component regressions
        run: npm run test
      - name: TypeScript and production bundle
        run: npm run build
      - name: Publish compiled station assets
        uses: actions/upload-artifact@v4
        with:
          name: vihanga-console-dist
          path: console/dist
          if-no-files-found: error

  independence:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify no Mission Planner dependency or extracted binary
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -iname 'MissionPlanner.exe' -o -iname 'MissionPlanner.dll' -o -iname '*.sln' -o -iname '*.csproj' \) -print | grep -q .; then
            echo 'FAIL: legacy Mission Planner binary or build project in standalone tree'
            exit 1
          fi
          if grep -R -n -E 'MissionPlanner\.exe|AeroHelm\.Cloud\.Plugin\.Validation\.dll' backend console --exclude-dir=node_modules; then
            echo 'FAIL: executable depends on the legacy ground station'
            exit 1
          fi
          echo 'PASS: standalone code tree contains no Mission Planner runtime dependency'


  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 14
    needs: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated local backend
        shell: pwsh
        run: |
          python -m venv .venv
          & .\.venv\Scripts\python.exe -m pip install -e .\backend
          if ($LASTEXITCODE -ne 0) { throw "Backend installation failed" }
      - name: Retrieve compiled station
        uses: actions/download-artifact@v4
        with:
          name: vihanga-console-dist
          path: console/dist
      - name: Boot the one-port Windows station
        shell: pwsh
        run: |
          .\scripts\Start-Vihanga-Standalone.ps1 -SkipInstall -NoOpen
          $health = Invoke-RestMethod 'http://127.0.0.1:8010/api/v1/health'
          if ($health.service -ne 'vihanga-standalone' -or $health.console_served -ne $true -or $health.physical_flight_control -ne $false) {
            throw "Wrong API or unexpected flight-control authority"
          }
          $homepage = Invoke-WebRequest 'http://127.0.0.1:8010/'
          if ($homepage.Content -notmatch 'src="(/assets/[^"]+\.js)"') {
            throw "No compiled module in the station page"
          }
          $module = Invoke-WebRequest ("http://127.0.0.1:8010" + $Matches[1])
          if ($module.StatusCode -ne 200 -or -not $module.Content) { throw "Compiled module unavailable" }
          .\scripts\Start-Vihanga-Standalone.ps1 -SkipInstall -NoOpen
          $capabilities = Invoke-RestMethod 'http://127.0.0.1:8010/api/v1/capabilities'
          if ($capabilities.bench_nonactuating_requests -ne $false) {
            throw "Unrequested bench mode was enabled"
          }
      - name: Check bench script rejects missing physical safety confirmation
        shell: pwsh
        run: |
          try {
            .\scripts\Test-Vihanga-BenchRead.ps1 -Query FC_VERSION
            throw "Bench script did not enforce propeller confirmation"
          } catch {
            if ($_.Exception.Message -notmatch 'Propeller-free bench confirmation') { throw }
          }
