[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vihanga-core"
version = "0.1.0"
description = "Standalone Vihanga operations API (non-actuating development profile)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn>=0.30,<1.0", "httpx>=0.27,<1.0", "websockets>=14,<17", "pymavlink>=2.4.42,<3", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["vihanga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
