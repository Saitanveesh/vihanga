# Localhost-only staging relay. TLS/private network is an independent gateway.
services:
  cloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: vihanga-cloud:staging
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8750:8750"
    mem_limit: 384m
    cpus: 0.7
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8750/health', timeout=2).read()"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
